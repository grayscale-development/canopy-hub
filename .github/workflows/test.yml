name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

jobs:
  test:
    name: Lint, typecheck, unit, DB, and e2e smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      OPENAI_CHAT_MODEL: fake-chat
      OPENAI_EMBEDDING_MODEL: fake-embedding
      CANOPY_TEST_PASSWORD: canopy-test-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm test:e2e:install

      - name: Start local Supabase
        run: |
          supabase start
          supabase status -o env > supabase.env
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          grep '^ANON_KEY=' supabase.env | sed 's/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/' >> "$GITHUB_ENV"
          grep '^SERVICE_ROLE_KEY=' supabase.env | sed 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' >> "$GITHUB_ENV"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit, component, and API tests with coverage
        run: pnpm test:coverage

      - name: Supabase Edge Function tests
        run: pnpm test:functions

      - name: Reset and seed local Supabase
        run: pnpm test:db:reset && pnpm test:db:seed

      - name: Database and RLS tests
        run: CANOPY_DB_TESTS=1 pnpm exec vitest run tests/db

      - name: Build
        run: pnpm build

      - name: Playwright smoke tests
        run: pnpm test:e2e --grep "@smoke"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
